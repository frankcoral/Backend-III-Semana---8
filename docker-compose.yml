services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: week8-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - banco-net

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: week8-kafka-init
    depends_on:
      - kafka
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Esperando a Kafka..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic banco.retiros.solicitados --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic banco.retiros.resultados --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic banco.retiros.dlt --partitions 3 --replication-factor 1
        echo "Topics Kafka Semana 8 listos."
    networks:
      - banco-net

  config-server:
    build:
      context: ./config-server
    image: banco-config-server:semana8
    container_name: banco-config-server
    ports:
      - "8888:8888"
    restart: on-failure
    networks:
      - banco-net

  discovery-server:
    build:
      context: ./discovery-server
    image: banco-discovery-server:semana8
    container_name: banco-discovery-server
    ports:
      - "8761:8761"
    restart: on-failure
    networks:
      - banco-net

  auth-server:
    build:
      context: ./auth-server
    image: banco-auth-server:semana8
    container_name: banco-auth-server
    ports:
      - "9000:9000"
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: http://localhost:9000
    depends_on:
      - discovery-server
    restart: on-failure
    networks:
      - banco-net

  core-banco:
    build:
      context: ./core-banco
    image: banco-core-banco:semana8
    container_name: banco-core-banco
    ports:
      - "8080:8080"
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: http://localhost:9000
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RETIROS_CONCURRENCY: 3
    depends_on:
      - discovery-server
      - auth-server
      - kafka
      - kafka-init
    restart: on-failure
    networks:
      - banco-net

  bff-web:
    build:
      context: ./bff-web
    image: banco-bff-web:semana8
    container_name: banco-bff-web
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: http://localhost:9000
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      SSL_KEYSTORE_PASSWORD: changeit
    depends_on:
      - config-server
      - discovery-server
      - auth-server
      - core-banco
    restart: on-failure
    networks:
      - banco-net

  bff-mobile:
    build:
      context: ./bff-mobile
    image: banco-bff-mobile:semana8
    container_name: banco-bff-mobile
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: http://localhost:9000
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      SSL_KEYSTORE_PASSWORD: changeit
    depends_on:
      - config-server
      - discovery-server
      - auth-server
      - core-banco
    restart: on-failure
    networks:
      - banco-net

  bff-atm:
    build:
      context: ./bff-atm
    image: banco-bff-atm:semana8
    container_name: banco-bff-atm
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_ISSUER_URI: http://localhost:9000
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RESULTADOS_CONCURRENCY: 3
      SSL_KEYSTORE_PASSWORD: changeit
    depends_on:
      - config-server
      - discovery-server
      - auth-server
      - core-banco
      - kafka
      - kafka-init
    restart: on-failure
    networks:
      - banco-net

networks:
  banco-net:
    driver: bridge
