spring.application.name=bff-mobile

# -------------------------------------------------------------------
# Semana 6/8 - Spring Cloud Config + Eureka Service Discovery
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
# -------------------------------------------------------------------

server.port=8082

# -------------------------------------------------------------------
# HTTPS local para el BFF Mobile
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-local
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Semana 8 - OAuth2 Resource Server
# El BFF valida JWT emitidos por auth-server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:9000}
# -------------------------------------------------------------------

management.endpoints.web.exposure.include=health,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always

# -------------------------------------------------------------------
# Semana 6/8 - Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.coreBancoMobile.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.coreBancoMobile.sliding-window-size=4
resilience4j.circuitbreaker.instances.coreBancoMobile.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.coreBancoMobile.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.coreBancoMobile.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.coreBancoMobile.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.coreBancoMobile.automatic-transition-from-open-to-half-open-enabled=true
# -------------------------------------------------------------------
