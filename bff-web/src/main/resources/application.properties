spring.application.name=bff-web

# -------------------------------------------------------------------
# Semana 6 - Spring Cloud
# Config Server centralizado (puerto 8888)
# "optional" permite ejecutar pruebas locales aunque Config Server no esté disponible.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Eureka Service Discovery (puerto 8761)
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
# -------------------------------------------------------------------

server.port=8081
# HTTPS local para los BFF. El certificado PKCS12 puede regenerarse con scripts/generar-certificados.ps1.
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-local

# -------------------------------------------------------------------
# Semana 8 - OAuth2 Resource Server
# El BFF Web valida los JWT emitidos por el Authorization Server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:9000}
# -------------------------------------------------------------------

management.endpoints.web.exposure.include=health,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always

# -------------------------------------------------------------------
# Semana 6 - Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.coreBancoWeb.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.coreBancoWeb.sliding-window-size=4
resilience4j.circuitbreaker.instances.coreBancoWeb.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.coreBancoWeb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.coreBancoWeb.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.coreBancoWeb.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.coreBancoWeb.automatic-transition-from-open-to-half-open-enabled=true
# -------------------------------------------------------------------
