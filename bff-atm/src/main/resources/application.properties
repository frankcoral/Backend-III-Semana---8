spring.application.name=bff-atm

# -------------------------------------------------------------------
# Semana 6/8 - Spring Cloud Config + Eureka Service Discovery
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
# -------------------------------------------------------------------

server.port=8083

# -------------------------------------------------------------------
# HTTPS local para el BFF ATM
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-local
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Semana 8 - OAuth2 Resource Server
# El BFF valida JWT emitidos por auth-server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:9000}
# -------------------------------------------------------------------

management.endpoints.web.exposure.include=health,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always

# -------------------------------------------------------------------
# Semana 6/8 - Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.coreBancoAtm.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.coreBancoAtm.sliding-window-size=4
resilience4j.circuitbreaker.instances.coreBancoAtm.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.coreBancoAtm.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.coreBancoAtm.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.coreBancoAtm.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.coreBancoAtm.automatic-transition-from-open-to-half-open-enabled=true
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Semana 7/8 - Apache Kafka
# Broker local ejecutado mediante Docker Compose.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Serializacion de la clave de particionamiento.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Los eventos se publican como JSON.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Se evita incluir el nombre de la clase Java como header.
# ATM y Core poseen contratos equivalentes en paquetes diferentes.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Entrega robusta del producer Kafka.
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Semana 7/8 - Consumidor de resultados de retiros
spring.kafka.consumer.group-id=bff-atm-retiros-resultados
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.bancoxyz.bffatm.event.RetiroResultadoEvent

# Tres consumidores internos permiten aprovechar las tres particiones del topic.
app.kafka.resultados.concurrency=${KAFKA_RESULTADOS_CONCURRENCY:3}
# -------------------------------------------------------------------
